<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; cursor: crosshair; background: transparent; }
    #screenshot-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
    #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); }
    #selection { position: fixed; border: 2px solid #3b82f6; background: transparent; pointer-events: none; display: none; z-index: 10; }
    #selection-info { position: fixed; background: #1f2937; color: #e5e7eb; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-family: monospace; pointer-events: none; display: none; z-index: 9999; }
  </style>
</head>
<body>
  <img id="screenshot-bg" />
  <div id="overlay"></div>
  <div id="selection"></div>
  <div id="selection-info"></div>
  <script type="module" src="/src/screenshot.ts"></script>
</body>
</html>
